android {
    defaultConfig {
        multiDexEnabled true
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main/kotlin'
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://s3.eu-west-1.amazonaws.com/m2repository.catapush.com/" }
}

buildscript {
    apply from: '../CordovaLib/cordova.gradle'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${cordovaConfig.KOTLIN_VERSION}"
    implementation 'androidx.multidex:multidex:2.0.1'
    api 'com.catapush.catapush-android-sdk:core:14.0.0'
    api 'com.catapush.catapush-android-sdk:gms:14.0.0'
}